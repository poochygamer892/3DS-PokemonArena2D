name: Build Nintendo 3DS homebrew

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/build-3ds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare original homebrew icon
        run: base64 -d native/icon.png.b64 > native/icon.png

      - name: Build 3DSX, SMDH and ELF
        run: make -C native

      - name: Upload native build outputs
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: |
            native/pokemonarena2d.3dsx
            native/pokemonarena2d.elf
            native/pokemonarena2d.smdh
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download native build outputs
        uses: actions/download-artifact@v4
        with:
          name: native-build
          path: .

      - name: Install pinned makerom release
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            -o "$RUNNER_TEMP/makerom.zip"
          echo "287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  $RUNNER_TEMP/makerom.zip" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/makerom"
          unzip -q "$RUNNER_TEMP/makerom.zip" -d "$RUNNER_TEMP/makerom"
          chmod +x "$RUNNER_TEMP/makerom/makerom"

      - name: Package CIA for homebrew-enabled consoles
        run: |
          "$RUNNER_TEMP/makerom/makerom" -f cia -o native/pokemonarena2d.cia \
            -rsf native/pokemonarena2d.rsf \
            -target t \
            -elf native/pokemonarena2d.elf \
            -icon native/pokemonarena2d.smdh \
            -desc app:4

      - name: Upload 3DS packages
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-arena-2d-homebrew
          path: |
            native/pokemonarena2d.3dsx
            native/pokemonarena2d.cia
            native/pokemonarena2d.elf
            native/pokemonarena2d.smdh
          if-no-files-found: error
